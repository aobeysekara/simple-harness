<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title description">
  <title id="title">Shared work across independent sessions</title>
  <desc id="description">Python, command-line and agent clients connect to a collaboration harness backed by SQLite. The harness stores selected work, exact references, review and permissions.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#47776b" stroke-width="1.8"/></marker>
  </defs>
  <rect width="1120" height="420" rx="20" fill="#f2f6f3"/>
  <g font-family="Arial, sans-serif" fill="#193c33">
    <text x="40" y="49" font-size="14" font-weight="700" letter-spacing="2">SIMPLE HARNESS</text>
    <text x="40" y="86" font-size="28" font-weight="700">Shared work across independent sessions</text>
    <rect x="40" y="124" width="250" height="82" rx="12" fill="#fff" stroke="#cbded5"/>
    <text x="60" y="157" font-size="20" font-weight="700">Python / CLI</text>
    <text x="60" y="184" font-size="15" fill="#4a665e">Local tools and integrations</text>
    <rect x="40" y="230" width="250" height="82" rx="12" fill="#fff" stroke="#cbded5"/>
    <text x="60" y="263" font-size="20" font-weight="700">Agent sessions</text>
    <text x="60" y="290" font-size="15" fill="#4a665e">Authenticated MCP / HTTP</text>
    <path d="M290 165H358" fill="none" stroke="#47776b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M290 271H358" fill="none" stroke="#47776b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="375" y="124" width="390" height="188" rx="12" fill="#193c33"/>
    <text x="400" y="162" font-size="23" fill="#fff" font-weight="700">Collaboration harness</text>
    <g font-size="17" fill="#e1eee7">
      <text x="400" y="204">Sessions and exact references</text>
      <text x="400" y="241">Review and scoped reuse</text>
      <text x="400" y="278">Permissions and retry receipts</text>
    </g>
    <path d="M765 218H833" fill="none" stroke="#47776b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="850" y="165" width="230" height="106" rx="12" fill="#fff" stroke="#cbded5"/>
    <text x="875" y="205" font-size="23" font-weight="700">SQLite</text>
    <text x="875" y="237" font-size="15" fill="#4a665e">Durable shared records</text>
    <path d="M40 349H1080" stroke="#cbded5"/>
    <text x="40" y="384" font-size="17" fill="#4a665e">Your host runs models. SIMple stores selected work.</text>
  </g>
</svg>
