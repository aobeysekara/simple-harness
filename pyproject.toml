[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simple-framework"
version = "0.1.0a1"
description = "Shared work, exact references and review across independent sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Indi Obeysekara"}]
keywords = ["collaboration", "mcp", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["typer>=0.16,<1"]

[project.urls]
Repository = "https://github.com/aobeysekara/simple-harness"
Documentation = "https://github.com/aobeysekara/simple-harness/blob/main/README.md"
Issues = "https://github.com/aobeysekara/simple-harness/issues"
Changelog = "https://github.com/aobeysekara/simple-harness/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
exclude = ["/docs/evidence"]

[project.optional-dependencies]
server = [
    "mcp>=2.3,<3",
    "starlette>=1,<2",
    "pydantic>=2.12,<3",
    "anyio>=4,<5",
    "httpx2>=2.16,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
simple = "simple_framework.cli:main"
simple-serve = "simple_framework.server:main"
simple-pilot = "simple_framework.pilot:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-mock>=3.14,<4", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples", "scripts"]
